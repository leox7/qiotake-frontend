<!-- First thing a keyboard user reaches with Tab: jumps over the navbar to the page. Only visible while focused. -->
<a class="skip-link" href="#main-content" (click)="skipToContent($event)">Skip to main content</a>
@if (showNavbarAndFooter()) {
  <app-navbar />
}
<main id="main-content" tabindex="-1">
  <router-outlet />
</main>
@if (showFooter()) {
  <app-footer />
}

<!-- Pop-up messages from ToastService. Always on the page, whatever the layout. -->
<app-toast />
